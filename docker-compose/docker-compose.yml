services:
  devsetgoMain:
    image: mikeryan56/dsg:2026-07-24-001
    env_file:
      - .env
    restart: always
    ports:
      - "5000"
    networks:
      - web
    labels:
      - "traefik.http.middlewares.dsg-main-https.redirectscheme.scheme=https"
      - "traefik.enable=true"
      - "traefik.http.routers.dsg-main-web.rule=Host(`www.devsetgo.com`) || Host(`devsetgo.com`)"
      - "traefik.http.routers.dsg-main-web.entrypoints=web"
      - "traefik.http.routers.dsg-main-web.middlewares=redirect@file"
      - "traefik.http.routers.dsg-main-secured.rule=Host(`www.devsetgo.com`) || Host(`devsetgo.com`)"
      - "traefik.http.routers.dsg-main-secured.entrypoints=web-secured"
      - "traefik.http.routers.dsg-main-secured.tls.certresolver=mytlschallenge"
      - "traefik.http.services.dsg-main.loadbalancer.server.port=5000"
      - "traefik.http.routers.dsg-main-web.service=dsg-main"
      - "traefik.http.routers.dsg-main-secured.service=dsg-main"
    volumes:
      - log-volume:/app/log
      # SQLite file (checks + PyPI metadata cache). One container only: SQLite
      # on a shared volume must not be written by two hosts.
      - sqlite-volume:/app/sqlite_db

networks:
  web:
    external: true

volumes:
  log-volume:
    driver: local
  sqlite-volume:
    driver: local
