{% extends "base.html" %}
{% block page_title %}| {{ code }}{% endblock %}
{% block page_breadcrumb %}Error{% endblock %}
{% block page_head_title %}{{ code }} {{ title }}{% endblock %}
{% block body %}
<div class="card">
  <div class="card-body text-center py-5">
    <i class="fa-solid {{ 'fa-magnifying-glass' if code == 404 else 'fa-triangle-exclamation' }} fa-3x text-muted mb-3"></i>
    <p class="lead">{{ description }}</p>
    <a class="btn btn-primary" href="/check">Check a requirements file</a>
  </div>
</div>
{% endblock %}
