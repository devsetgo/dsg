name: Docker Image
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Read the app version (bumpcalver writes it to the makefile)
        id: version
        run: echo "version=$(grep -m1 '^APP_VERSION' makefile | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            mikeryan56/dsg:${{ steps.version.outputs.version }}
            mikeryan56/dsg:latest
