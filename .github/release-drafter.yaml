# name-template: 'v$RESOLVED_VERSION'
# tag-template: 'v$RESOLVED_VERSION'
template: |
  #### What's Changed
  $CHANGES
categories:
  - title: 'Breaking'
    # ai-pr-assistant always uses "breaking-change" for detected breaking changes.
    labels:
      - 'type: breaking'
      - 'breaking-change'
  - title: 'New'
    label: 'type: feature'
  - title: 'Bug Fixes'
    label: 'type: bug'
  - title: 'Maintenance'
    label: 'type: maintenance'
  - title: 'Documentation'
    label: 'type: docs'
  - title: 'Dependency Updates'
    label: 'type: dependencies'
  - title: 'Security'
    label: 'type: security'

version-resolver:
  major:
    labels:
      - 'type: breaking'
      - 'breaking-change'
  minor:
    labels:
      - 'type: feature'
  patch:
    labels:
      - 'type: bug'
      - 'type: maintenance'
      - 'type: docs'
      - 'type: dependencies'
      - 'type: security'