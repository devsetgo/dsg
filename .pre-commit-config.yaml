repos:
-   repo: https://github.com/psf/black
    # Keep in step with the black pin in requirements/dev.txt, or `make format`
    # and the pre-commit hook will disagree on formatting.
    rev: 26.10.1
    hooks:
    - id: black
      language_version: python3
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # - id: fix-encoding-pragma
      - id: trailing-whitespace
      # - id: check-json
      # - id: pretty-format-json
      - id: requirements-txt-fixer
        # The fixture is a verbatim sample input; its line order is part of the test.
        exclude: ^tests/fixtures/

